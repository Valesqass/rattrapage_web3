# Broker du centre de rehabilitation (voir docs/protocole.md)

per_listener_settings false

# --- Persistance : sessions persistantes, messages en file et messages retenus survivent au redemarrage
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# File d'attente par client en session persistante (coupure front ou node < 10 min, cf. contraintes)
max_queued_messages 50000
persistent_client_expiration 2d

# --- Authentification et ACL
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

# --- Journaux
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Ecoutes
# TCP : nodes et passerelle
listener 1883
protocol mqtt

# WebSocket : front web (navigateur)
listener 9001
protocol websockets
